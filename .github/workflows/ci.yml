name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

# A pull request shares one group per ref, so a newer commit cancels its older check.
# A push gets a group of its own (the run ID), so no push run cancels or replaces another.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check, test and build
    # Runs on the public repository only (setlist-controller#604): the private archive's 2-CPU runner timed the test step
    # out (3e3657a). A pull request from a branch of this repository is already checked by the push of that branch, so
    # only a pull request from a fork runs here as a pull request.
    if: ${{ !github.event.repository.private && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    # The test step took 339 s in a node:24 container held to 4 CPUs, the public runner's size, on 2026-11-24.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
